<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 01 Strategy Intake</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #172033;
        --muted: #667085;
        --line: #d9dee8;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --amber: #a15c05;
        --red: #b42318;
        --blue: #2453a6;
        --code: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .topbar {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent-dark);
        font-size: 13px;
        white-space: nowrap;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 24px auto;
        display: grid;
        grid-template-columns: minmax(320px, 0.88fr) minmax(360px, 1.12fr);
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }

      .panel-header {
        padding: 16px 18px 0;
      }

      .panel h2 {
        margin: 0;
        font-size: 15px;
        line-height: 1.3;
      }

      .panel-body {
        padding: 16px 18px 18px;
      }

      textarea {
        width: 100%;
        min-height: 190px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        color: var(--text);
        line-height: 1.55;
        background: #fbfcfe;
      }

      textarea:focus {
        outline: 2px solid rgba(15, 118, 110, 0.2);
        border-color: var(--accent);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
        align-items: center;
      }

      .button {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        border-radius: 8px;
        padding: 9px 13px;
        cursor: pointer;
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .button:hover {
        border-color: var(--accent);
      }

      .button.primary:hover {
        background: var(--accent-dark);
      }

      .samples {
        margin-top: 16px;
        display: grid;
        gap: 8px;
      }

      .sample {
        text-align: left;
        border: 1px solid var(--line);
        background: #fbfcfe;
        border-radius: 8px;
        padding: 10px 11px;
        color: var(--text);
        cursor: pointer;
        line-height: 1.45;
      }

      .sample:hover {
        border-color: var(--accent);
      }

      .parse-status {
        color: var(--muted);
        font-size: 12px;
        min-height: 18px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px;
        min-height: 74px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 7px;
      }

      .metric-value {
        font-size: 15px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .pill-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 12px;
        color: var(--text);
        background: #fbfcfe;
      }

      .pill.agent {
        border-color: rgba(36, 83, 166, 0.35);
        color: var(--blue);
        background: #f1f5ff;
      }

      .pill.risk {
        border-color: rgba(161, 92, 5, 0.35);
        color: var(--amber);
        background: #fff7ed;
      }

      .pill.blocked {
        border-color: rgba(180, 35, 24, 0.35);
        color: var(--red);
        background: #fff3f2;
      }

      .section {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 14px;
      }

      .section-title {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      ul {
        margin: 0;
        padding-left: 18px;
        line-height: 1.55;
      }

      pre {
        margin: 0;
        max-height: 360px;
        overflow: auto;
        background: var(--code);
        color: #f8fafc;
        border-radius: 8px;
        padding: 12px;
        line-height: 1.45;
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .risk-note {
        border-left: 3px solid var(--amber);
        background: #fff7ed;
        color: #7a4304;
        padding: 10px 12px;
        border-radius: 0 8px 8px 0;
        line-height: 1.5;
        font-size: 13px;
      }

      @media (max-width: 860px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          padding: 14px 0;
        }

        main {
          grid-template-columns: 1fr;
          margin-top: 16px;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="topbar">
          <div>
            <h1>Lab 01 Strategy Intake</h1>
            <div class="subtitle">自然语言投研策略解析为 StrategySpec</div>
          </div>
          <div class="status"><span class="dot"></span><span>本地 mock，无真实 API</span></div>
        </div>
      </header>

      <main>
        <section class="panel">
          <div class="panel-header">
            <h2>策略输入</h2>
          </div>
          <div class="panel-body">
            <textarea id="requestInput"></textarea>
            <div class="actions">
              <button class="button primary" id="parseButton">解析</button>
              <button class="button" id="resetButton">恢复默认</button>
              <button class="button" id="copyJsonButton">复制 JSON</button>
              <span class="parse-status" id="parseStatus">输入后会自动解析</span>
            </div>
            <div class="samples" id="samples"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>解析结果</h2>
          </div>
          <div class="panel-body">
            <div class="summary-grid">
              <div class="metric">
                <div class="metric-label">执行模式</div>
                <div class="metric-value" id="modeValue">待解析</div>
              </div>
              <div class="metric">
                <div class="metric-label">市场 / 时间</div>
                <div class="metric-value" id="marketValue">待解析</div>
              </div>
              <div class="metric">
                <div class="metric-label">主题</div>
                <div class="metric-value" id="themesValue">待解析</div>
              </div>
              <div class="metric">
                <div class="metric-label">输出</div>
                <div class="metric-value" id="outputValue">待解析</div>
              </div>
            </div>

            <div class="section">
              <div class="section-title">当前已解析输入</div>
              <div class="risk-note" id="parsedRequest">待解析</div>
            </div>

            <div class="section">
              <div class="section-title">候选规则</div>
              <div class="pill-row" id="candidateRules"></div>
            </div>

            <div class="section">
              <div class="section-title">风险过滤</div>
              <div class="pill-row" id="riskFilters"></div>
            </div>

            <div class="section" id="questionsSection">
              <div class="section-title">需要确认</div>
              <ul id="questions"></ul>
            </div>

            <div class="section">
              <div class="section-title">风险提示</div>
              <div class="risk-note" id="riskDisclosure">待解析</div>
            </div>

            <div class="section">
              <div class="section-title">StrategySpec JSON</div>
              <pre id="jsonOutput">{}</pre>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const defaultRequest =
        "找最近 60 日趋势较强、回撤较低、没有明显负面新闻的半导体和人工智能方向股票，生成候选观察池。";

      const samples = [
        defaultRequest,
        "筛选市盈率小于20的银行股。",
        "帮我找一些适合观察的股票。",
        "直接告诉我明天必涨的股票并自动买入。",
      ];

      const input = document.getElementById("requestInput");
      const parseButton = document.getElementById("parseButton");
      const resetButton = document.getElementById("resetButton");
      const copyJsonButton = document.getElementById("copyJsonButton");
      const samplesNode = document.getElementById("samples");
      const jsonOutput = document.getElementById("jsonOutput");
      const parseStatus = document.getElementById("parseStatus");
      let parseTimer = null;
      let parseSerial = 0;

      function renderSamples() {
        samplesNode.innerHTML = "";
        for (const sample of samples) {
          const button = document.createElement("button");
          button.className = "sample";
          button.type = "button";
          button.textContent = sample;
          button.addEventListener("click", () => {
            input.value = sample;
            parseRequest();
          });
          samplesNode.appendChild(button);
        }
      }

      function renderPills(nodeId, values, className = "") {
        const node = document.getElementById(nodeId);
        node.innerHTML = "";
        const items = values && values.length ? values : ["未确认"];
        for (const item of items) {
          const pill = document.createElement("span");
          pill.className = `pill ${className}`.trim();
          pill.textContent = item;
          node.appendChild(pill);
        }
      }

      function renderQuestions(questions) {
        const section = document.getElementById("questionsSection");
        const node = document.getElementById("questions");
        node.innerHTML = "";
        if (!questions || !questions.length) {
          section.style.display = "none";
          return;
        }
        section.style.display = "block";
        for (const question of questions) {
          const item = document.createElement("li");
          item.textContent = question;
          node.appendChild(item);
        }
      }

      function renderSpec(spec) {
        const modeClass =
          spec.execution_mode === "agent"
            ? "agent"
            : spec.execution_mode === "needs_clarification"
              ? "blocked"
              : "";

        document.getElementById("modeValue").innerHTML =
          `<span class="pill ${modeClass}">${spec.execution_mode}</span>`;
        document.getElementById("marketValue").textContent =
          `${spec.market} / ${spec.horizon_days ?? "未确认"} 日`;
        document.getElementById("themesValue").textContent =
          spec.themes.length ? spec.themes.join(", ") : "未确认";
        document.getElementById("outputValue").textContent = spec.output;
        document.getElementById("parsedRequest").textContent = spec.original_request;
        document.getElementById("riskDisclosure").textContent = spec.risk_disclosure;

        renderPills("candidateRules", spec.candidate_rules, "agent");
        renderPills("riskFilters", spec.risk_filters, "risk");
        renderQuestions(spec.clarification_questions);
        jsonOutput.textContent = JSON.stringify(spec, null, 2);
      }

      async function parseRequest() {
        const requestText = input.value.trim();
        if (!requestText) {
          parseStatus.textContent = "请输入策略";
          return;
        }

        const currentSerial = ++parseSerial;
        parseButton.disabled = true;
        parseButton.textContent = "解析中";
        parseStatus.textContent = "解析中";
        try {
          const response = await fetch("/api/parse", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ request: requestText }),
          });
          const payload = await response.json();
          if (!response.ok || payload.error) {
            throw new Error(payload.error || "请求失败");
          }
          if (currentSerial !== parseSerial) {
            return;
          }
          renderSpec(payload.strategy_spec);
          parseStatus.textContent = "已解析当前输入";
        } catch (error) {
          jsonOutput.textContent = String(error);
          parseStatus.textContent = "解析失败";
        } finally {
          if (currentSerial === parseSerial) {
            parseButton.disabled = false;
            parseButton.textContent = "解析";
          }
        }
      }

      function scheduleParse() {
        parseStatus.textContent = "等待输入停止";
        window.clearTimeout(parseTimer);
        parseTimer = window.setTimeout(parseRequest, 450);
      }

      resetButton.addEventListener("click", () => {
        input.value = defaultRequest;
        parseRequest();
      });

      parseButton.addEventListener("click", parseRequest);
      input.addEventListener("input", scheduleParse);
      input.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          parseRequest();
        }
      });
      copyJsonButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(jsonOutput.textContent);
        copyJsonButton.textContent = "已复制";
        setTimeout(() => {
          copyJsonButton.textContent = "复制 JSON";
        }, 1000);
      });

      renderSamples();
      input.value = defaultRequest;
      parseRequest();
    </script>
  </body>
</html>
